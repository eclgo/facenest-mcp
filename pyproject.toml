[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facenest-mcp"
version = "0.2.14"
description = "MCP server for the FaceNest desktop photo library (local, read-only by default)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "FaceNest", email = "support@facenest.net" }]
keywords = ["mcp", "model-context-protocol", "photos", "facenest", "ai-agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
facenest-mcp = "facenest_mcp.server:main"

[project.urls]
Homepage = "https://facenest.net"
Repository = "https://github.com/eclgo/facenest-mcp"
Documentation = "https://github.com/eclgo/facenest-mcp/blob/main/docs/QUICKSTART.md"
Changelog = "https://github.com/eclgo/facenest-mcp/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["facenest_mcp"]

